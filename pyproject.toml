[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-beam"
version = "0.5.0"
description = "Quantum-state analysis of market fluctuations, paper trading research and an oil value chain report."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
quant-beam = "quant_beam.__main__:main"

[tool.setuptools]
packages = ["quant_beam"]
